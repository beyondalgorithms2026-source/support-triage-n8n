# Non-secret settings for scripts/overnight.sh and scripts/preflight.sh. Edit before bed. No secrets here.
# The overnight worker cannot edit this file (permission deny + hash check).

# Claude Code CLI. It is not on PATH on this Mac; this is the binary bundled with the desktop app (2.1.295).
# If the app updates and this path disappears, the scripts pick the newest bundled binary automatically.
CLAUDE_BIN="/Users/Work/Library/Application Support/Claude/claude-code/2.1.295/9d6405864fdc/claude.app/Contents/MacOS/claude"
CLAUDE_MODEL="opus"            # --model
CLAUDE_FALLBACK_MODEL="sonnet" # --fallback-model (used only when the primary is overloaded / unavailable)
CLAUDE_EFFORT="high"           # --effort

# Budgets for Claude Code itself (USD as reported by `total_cost_usd`; on a subscription this is API-equivalent).
RUN_BUDGET_USD="12"     # --max-budget-usd per goal invocation
TOTAL_BUDGET_USD="100"  # the loop stops before starting an invocation that could exceed this

# Time
HARD_STOP_IST="08:00"   # Asia/Kolkata. The loop starts nothing after (stop - STOP_RESERVE_MIN) and kills a running goal at the stop.
STOP_RESERVE_MIN="10"   # minutes kept for final tests + MORNING_REPORT.md
GOAL_WALL_MIN="90"      # hard wall-clock limit per invocation

# Retries
MAX_ATTEMPTS="3"        # failed acceptance attempts before a goal is BLOCKED
LIMIT_RETRY_SEC="1800"  # wait between retries after a usage-limit / rate-limit / overloaded error (not counted as attempts)
